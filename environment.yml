name: feather
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  # Scientific stack
  - numpy
  - scipy
  - xarray
  - dask
  - distributed
  # Geospatial
  - cartopy
  - healpy
  # NetCDF / zarr
  - netcdf4
  - zarr
  # GRIB support
  - eccodes
  - cfgrib
  # Plotting
  - matplotlib
  - cmocean
  # I/O and config
  - pyyaml
  - jinja2>=3.0
  - nbformat
  # Data catalogs
  - intake
  - intake-xarray
  # Testing
  - pytest
  - pytest-cov
  # pip-only packages
  - pip
  - pip:
    # Pinned to a commit, not a tag: conservative remapping (PR #12) and the
    # pole fix (PR #13) both postdate the 0.4.1 release, and upstream did not
    # bump the version, so an installed nereus reports 0.4.1 either way and
    # `nereus==0.4.1` would silently give you a build without them.
    # Replace with `nereus==0.4.2` once upstream cuts a release.
    - nereus @ git+https://github.com/koldunovn/nereus@32c6226
    - gsw
    - pydantic>=2.0
    - google-genai>=1.0
    - openai>=1.0
    - kerchunk>=0.2
    - fastparquet>=2023.0
