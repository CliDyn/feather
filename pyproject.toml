[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feather"
version = "0.1.0"
description = "Lightweight climate model evaluation framework for high-resolution climate models"
requires-python = ">=3.10"
dependencies = [
    "xarray",
    "pandas",
    "cftime",
    "dask",
    "distributed",
    "numpy",
    "scipy",
    "matplotlib",
    "cartopy",
    "intake",
    "intake-xarray",
    "healpy",
    "nereus",   # install from git; see environment.yml (0.4.1 on PyPI lacks conservative remapping)
    "pyyaml",
    "netcdf4",
    "zarr",
    "fsspec",
    "kerchunk>=0.2",      # kerchunk-parquet loaders (IFS-FESOM2 r2/r3, ICON r2/r3)
    "fastparquet>=2023.0",
    "gribscan>=0.0.16",   # codec of the IFS-FESOM2 r2/r3 kerchunk stores
    "gsw",                # TEOS-10 SA -> SP conversion in ocean_en4
    "cmocean",
    "regionmask>=0.13",   # AR6 (Iturbide et al. 2020) reference-region polygons
    "nbformat",
    "jinja2>=3.0",
    "pydantic>=2.0",
    "google-genai>=1.0",
    "openai>=1.0",
]

[project.scripts]
feather = "feather.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
grib = ["cfgrib", "eccodes"]

[tool.setuptools.packages.find]
include = ["feather*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring real data on Levante",
]

# Ship templates/CSS without relying on setuptools-scm's git file finder,
# which finds nothing when building from a tree without .git (Docker).
[tool.setuptools.package-data]
feather = [
    "website/templates/*.html",
    "website/static/*.css",
    "export/templates/*.jinja2",
]
