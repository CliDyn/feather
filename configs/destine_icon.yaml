  depth_levels:
    icon: [1.0, 3.1, 5.45, 8.1, 11.05, 14.35, 18.05, 22.2, 26.85, 32.0, 37.65, 43.8, 50.55, 57.95, 66.0, 74.8, 84.45, 95.0, 106.5, 119.1, 132.9, 147.95, 164.35, 182.25, 201.8, 223.15, 246.45, 271.85, 299.55, 329.75, 362.65, 398.45, 437.4, 479.25, 523.45, 569.5, 617.1, 666.3, 717.15, 769.7, 824.0, 880.1, 938.05, 997.9, 1059.75, 1124.5, 1194.1, 1270.7, 1356.3, 1451.7, 1556.8, 1671.95, 1796.45, 1929.5, 2071.4, 2222.45, 2382.9, 2552.9, 2732.5, 2921.75, 3120.6, 3328.85, 3546.25, 3772.45, 4006.95, 4249.15, 4498.3, 4753.55, 5014.0, 5278.6, 5546.25, 5815.75]
