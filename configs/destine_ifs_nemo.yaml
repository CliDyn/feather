project:
  name: "DestinE"
  description: "Destination Earth IFS-NEMO high-resolution climate model evaluation"
  experiment: "baseline_hist"
  period: ["1990", "2014"]
  resolution: "high-resolution (~5 km)"

data_source:
  type: "destine_catalog"

model_catalogs:
  2d: "/work/ab0995/a270088/DestinE/GENERATION2_joint/2D/catalog.yaml"
  3d: "/work/ab0995/a270088/DestinE/GENERATION2_joint/3D/catalog.yaml"

models:
  ifs-nemo:
    grids:
      sfc: healpix
      o2d: healpix
      o3d: healpix
    absolute_salinity: true

obs_root: "/work/bb1153/b382289/data/aqua-dvc/datasets"
obs_datasets:
  ERA5:
    path: "{obs_root}/ERA5/mon"
    variables:
      t2m: "ERA5_2m_temperature_mon_full_sfc_1940-2024.nc"
      sst: "ERA5_sea_surface_temperature_mon_full_sfc_1940-2024.nc"
      msl: "ERA5_mean_sea_level_pressure_mon_full_sfc_1940-2024.nc"
      tp: "ERA5_total_precipitation_mon_full_sfc_1940-2024.nc"
      tcc: "ERA5_total_cloud_cover_mon_full_sfc_1940-2024.nc"
      sshf: "ERA5_surface_sensible_heat_flux_mon_full_sfc_1940-2024.nc"
      slhf: "ERA5_surface_latent_heat_flux_mon_full_sfc_1940-2024.nc"
      ssr: "ERA5_surface_net_solar_radiation_mon_full_sfc_1940-2024.nc"
      str: "ERA5_surface_net_thermal_radiation_mon_full_sfc_1940-2024.nc"
      ssrc: "ERA5_surface_net_solar_radiation_clear_sky_mon_full_sfc_1940-2024.nc"
      strc: "ERA5_surface_net_thermal_radiation_clear_sky_mon_full_sfc_1940-2024.nc"
      tsr: "ERA5_top_net_solar_radiation_mon_full_sfc_1940-2024.nc"
      ttr: "ERA5_top_net_thermal_radiation_mon_full_sfc_1940-2024.nc"
      tsrc: "ERA5_top_net_solar_radiation_clear_sky_mon_full_sfc_1940-2024.nc"
      ttrc: "ERA5_top_net_thermal_radiation_clear_sky_mon_full_sfc_1940-2024.nc"
      tisr: "ERA5_surface_solar_radiation_downwards_mon_full_sfc_1940-2024.nc"
      ssrd: "ERA5_surface_solar_radiation_downwards_mon_full_sfc_1940-2024.nc"
      strd: "ERA5_surface_thermal_radiation_downwards_mon_full_sfc_1940-2024.nc"
      e: "ERA5_evaporation_mon_full_sfc_1940-2024.nc"
      tclw: "ERA5_total_column_cloud_liquid_water_mon_full_sfc_1940-2024.nc"
      tciw: "ERA5_total_column_cloud_ice_water_mon_full_sfc_1940-2024.nc"
      u10: "ERA5_10m_u_component_of_wind_mon_full_sfc_1940-2024.nc"
      v10: "ERA5_10m_v_component_of_wind_mon_full_sfc_1940-2024.nc"
      siconc_era5: "ERA5_sea_ice_cover_mon_full_sfc_1940-2024.nc"
  CERES_EBAF:
    path: "{obs_root}/CERES/EBAF_v4.2.1"
    variables:
      toa: "CERES_EBAF-TOA_Edition4.2.1_MONTHLY_200003-202506.nc"
      surface: "CERES_EBAF_Edition4.2.1_MONTHLY_200003-202506.nc"
  EN4:
    path: "{obs_root}/EN4/v4.2.2"
    variables:
      thetao: "thetao-EN4-1950-2024.nc"
      so: "so-EN4-1950-2024.nc"
  ESA_CCI:
    path: "/work/ab0995/a270088/DestinE/OBS/ESA-CCI_temp"
    variables:
      analysed_sst: "ESA-CCI-L4_v3.0.1_monthly_1990_2014_sst.nc"
      timemean: "ESA-CCI-L4_v3.0.1_timemean_1990_2014_sst.nc"
      ymonmean: "ESA-CCI-L4_v3.0.1_ymonmean_1990_2014_sst.nc"
  MSWEP:
    path: "{obs_root}/MSWEP/v2.8"
    variables:
      pr: "zarr/mswep280.past-nrt.monthly.zarr"
  OSI_SAF:
    path: "{obs_root}/OSI-SAF/OSI-AQUA"
    variables:
      nh: "monthly/ice_conc_nh_ease2-250_cdr_v3_monthly_1979-2024.nc"
      sh: "monthly/ice_conc_sh_ease2-250_cdr_v3_monthly_1979-2024.nc"
  PSC:
    path: "{obs_root}/PSC"
    variables:
      piomas: "PIOMAS/sithick_r1i1p1_mon_197901-202412_GCCS360x120_curvgrid.nc"
      giomas: "GIOMAS/sithick_r1i1p1_mon_197901-202412_GCCS360x276_curvgrid.nc"
  AVISO:
    path: "{obs_root}/AVISO/vDT2024"
  BERKELEY_EARTH:
    path: "{obs_root}/BERKELEY-EARTH/aqua-filled"
    variables:
      2t: "Berkeley-Earth_aqua-filled_1x1_1979-2024.nc"

cmip6:
  enabled: true
  catalog_path: "/home/a/a270088/PYTHON/DestinE/cmip6/cmip6_zarr_catalog.yaml"
  regrid_resolution: 0.25
  influence_radius: 80000
  ensemble_mode: "one_per_model"
  models:
    CanESM5:
      variant: "r1i1p2f1"
    MPI-ESM1-2-LR:
      variant: "r1i1p1f1"
    GISS-E2-1-G:
      variant: "r1i1p1f2"
    IPSL-CM6A-LR:
      variant: "r1i1p1f1"
    ACCESS-ESM1-5:
      variant: "r1i1p1f1"
    EC-Earth3:
      variant: "r1i1p1f1"
    CNRM-CM6-1:
      variant: "r1i1p1f2"
    AWI-CM-1-1-MR:
      variant: "r1i1p1f1"
    CNRM-ESM2-1:
      variant: "r1i1p1f2"
    FGOALS-g3:
      variant: "r1i1p1f1"
    INM-CM5-0:
      variant: "r1i1p1f1"
    MRI-ESM2-0:
      variant: "r1i1p1f1"

ocean_3d:
  depth_levels:
    ifs-nemo: [0.506, 1.556, 2.668, 3.856, 5.14, 6.543, 8.093, 9.823, 11.774, 13.991, 16.525, 19.43, 22.758, 26.558, 30.875, 35.74, 41.18, 47.212, 53.851, 61.113, 69.022, 77.611, 86.929, 97.041, 108.03, 120.0, 133.076, 147.406, 163.164, 180.55, 199.79, 221.141, 244.891, 271.356, 300.888, 333.863, 370.688, 411.794, 457.626, 508.64, 565.292, 628.026, 697.259, 773.368, 856.679, 947.448, 1045.854, 1151.991, 1265.861, 1387.377, 1516.364, 1652.568, 1795.671, 1945.296, 2101.027, 2262.422, 2429.025, 2600.38, 2776.039, 2955.57, 3138.565, 3324.641, 3513.446, 3704.657, 3897.982, 4093.159, 4289.953, 4488.155, 4687.581, 4888.07, 5089.479, 5291.683, 5494.575, 5698.061, 5902.058]
  # NEMO: half-levels computed from full levels (midpoints)

dask:
  n_workers: 4
  memory_limit: "8GB"

nereus:
  projection: "rob"
  resolution: 0.25
  influence_radius: 80000
  ocean_influence_radius: 20000
  method: "linear"
  # Common grid for `precipitation_mswep`.  DestinE runs are ~5 km, finer
  # than MSWEP, so the common grid stays at the MSWEP native 0.1°.
  precip_resolution: 0.1

output_dir: "./output_ifs_nemo"

llm:
  figure_analysis:
    provider: "vertex"
    model: "gemini-2.5-flash"
    api_key_env: "VERTEX_API_KEY"
    thinking_budget: 8192
    max_retries: 3
    retry_delay: 10
    skip_existing: true

report:
  model: "gpt-5.2-2025-12-11"
  max_tokens: 65536
  temperature: 0.3
  api_key_env: "OPENAI_API_KEY"
  n_highlights: 10

website:
  title: "Feather — IFS-NEMO Evaluation"
  subtitle: "DestinE IFS-NEMO High-Resolution Simulation vs Observations (1990-2014)"
  group_order:
    - evaluation
    - temperature
    - precipitation
    - radiation
    - circulation
    - ocean_surface
    - sea_ice
    - ocean_3d
    - atmosphere_3d
  group_labels:
    evaluation: "Global Biases"
    temperature: "Temperature"
    precipitation: "Precipitation"
    radiation: "Radiation Budget"
    circulation: "Atmospheric Circulation"
    clouds: "Clouds"
    wind: "Wind"
    moisture: "Moisture"
    surface_fluxes: "Surface Fluxes"
    ocean_surface: "Ocean Surface"
    sea_ice: "Sea Ice"
    ocean_3d: "Ocean 3D"
    atmosphere_3d: "Atmosphere 3D"
