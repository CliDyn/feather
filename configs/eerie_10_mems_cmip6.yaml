# ─────────────────────────────────────────────────────────────────────────────
# EERIE 10-member evaluation with TWO benchmark ensembles.
#
# Same as eerie_all_members_cmip6_highresmip.yaml plus ICON-ESM-ER r2/r3,
# taking the ensemble from 8 to 10 members (3 IFS-FESOM2-SR, 3 IFS-NEMO-ER,
# 3 ICON-ESM-ER, 1 HadGEM3-GC5).
#
# ICON r2/r3 are NOT in the CMOR tree — only r1 is.  They are published as
# intake catalogues over kerchunk reference stores, read here by the
# `icon_kerchunk` backend (feather/data/icon_kerchunk_loader.py):
#     /work/bm1344/DKRZ/intake/disk/phase2-model-output/icon-esm-er/hist-1950/
#         r{2,3}i1p1f1/{atmos,ocean}/gr025/main.yaml
#   → /work/bm1344/DKRZ/kerchunks_batched/ICON/phase2/hist-1950/v20240618/{2,3}/
# Already 0.25° lat/lon, monthly, 1975-02 → 2014-12, so the 1980–2014 window
# is fully covered.
#
# Coverage caveats for the two new members (both flagged by design — see the
# loader docstring):
#   * No 3-D ocean → `ocean_en4` evaluates ICON r1 only.
#   * No 3-D atmosphere → `teleconnections` QBO skips them.
#   * Net-radiation variables (rss/rls/rst/rlt + clear-sky) are not derived,
#     matching ICON r1, which the CMOR tree does not publish them for either.
#   * The ocean/sea-ice stores have gaps in the published archive (atmosphere
#     is complete): r2 is missing 1996-02..06 (5 months) and r3 is missing
#     1982-08..12 and 1993-04..1994-03 (17 months) out of 420.  Climatologies
#     and seasonal cycles absorb this (33-35 samples per calendar month vs 35);
#     ocean time-series figures will show the gaps.
#
# Benchmarks:
#   * CMIP6 historical  — all models on disk, one member each (full DKRZ pool)
#   * HighResMIP hist-1950 — all models on disk, one member each
#
# Both benchmarks are read from a per-variable zarr cache built once with
# scripts/convert_pool_cmip6.py (see commands below).  Models are auto-
# discovered from the cache (`models: auto`).  Each benchmark is rendered as
# its own multi-model-mean (MMM) line/panel.
#
# Build the cache first (compute node — heavy I/O):
#   python scripts/convert_pool_cmip6.py --activity CMIP \
#       --experiment historical --period 1980 2014 \
#       --out /work/bm1344/AWI/EERIE/cmip6_pool_zarr/cmip6_historical -v
#   python scripts/convert_pool_cmip6.py --activity HighResMIP \
#       --experiment hist-1950 --period 1980 2014 \
#       --out /work/bm1344/AWI/EERIE/cmip6_pool_zarr/highresmip_hist-1950 -v
# ─────────────────────────────────────────────────────────────────────────────

project:
  name: "EERIE"
  description: "EERIE 10-member ensemble evaluation vs CMIP6 + HighResMIP benchmarks"
  experiment: "hist-1950"
  period: ["1980", "2014"]
  seasons: [annual, DJF, MAM, JJA, SON]
  resolution: "high-resolution (~10-20 km atm, ~5-10 km ocean)"
  comparison_type: "multi_model"
  comparison_description: >-
    EERIE 10-member ensemble (3 members IFS-FESOM2-SR, 3 members IFS-NEMO-ER,
    3 members ICON-ESM-ER, 1 member HadGEM3-GC5) with option to be evaluated
    against one or two benchmark ensembles: the full CMIP6 historical
    multi-model mean and the HighResMIP hist-1950 multi-model mean, each
    computed from one member per model.

# Global default source for the majority of models (CMOR).  Overridden
# per-model by IFS-FESOM2-SR r2/r3 (kerchunk_parquet) and ICON-ESM-ER r2/r3
# (icon_kerchunk), which routes everything through CompositeModelLoader.
data_source:
  type: "cmor"
  root: "/work/bm1344/DKRZ/CMOR/EERIE/HighResMIP"

models:
  # ── IFS-FESOM2-SR ──────────────────────────────────────────────────────
  IFS-FESOM2-SR:
    institution: AWI
    ensemble: EERIE
    experiment: hist-1950
    variant: r1i1p1f1
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#1f77b4"
    # r1's CMOR tree publishes only downward radiation (rsds/rlds) — no TOA
    # or net surface fluxes.  Source the net radiation from the full-period
    # (1950–2014) batched kerchunk-parquet store instead.  It is a flat-file
    # layout with daily-only gr025 average fields (the loader resamples them
    # to monthly and reconstructs the gr025 grid, which the store omits).
    # Used only as a fallback by the radiation_budget diagnostic; every other
    # variable (incl. 3D ocean) still comes from CMOR.
    radiation_source:
      type: kerchunk_parquet
      data_root: "/work/bm1344/DKRZ/kerchunks_pp_batched/IFS-FESOM2/hist-1950/v20240304"

  IFS-FESOM2-SR-r2:
    institution: AWI
    ensemble: EERIE
    experiment: hist-1950
    variant: r2i1p1f1
    data_source_type: "kerchunk_parquet"
    data_root: "/work/bm1344/DKRZ/kerchunks/IFS-FESOM2/hist-1950"
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#5aabdf"

  IFS-FESOM2-SR-r3:
    institution: AWI
    ensemble: EERIE
    experiment: hist-1950
    variant: r3i1p1f1
    data_source_type: "kerchunk_parquet"
    data_root: "/work/bm1344/DKRZ/kerchunks/IFS-FESOM2/hist-1950"
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#9fcfe8"

  # ── IFS-NEMO-ER ────────────────────────────────────────────────────────
  IFS-NEMO-ER:
    institution: BSC
    ensemble: EERIE
    experiment: hist-1950
    variant: r1i1p1f1
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#ff7f0e"
    absolute_salinity: true

  IFS-NEMO-ER-r2:
    institution: BSC
    ensemble: EERIE
    experiment: hist-1975
    variant: r2i1p1f1
    data_root: "/work/bm1344/DKRZ/CMOR/EERIE/HighResMIP/BSC/IFS-NEMO-ER"
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#e07b00"
    absolute_salinity: true

  IFS-NEMO-ER-r3:
    institution: BSC
    ensemble: EERIE
    experiment: hist-1975
    variant: r3i1p1f1
    data_root: "/work/bm1344/DKRZ/CMOR/EERIE/HighResMIP/BSC/IFS-NEMO-ER"
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#a85800"
    absolute_salinity: true

  # ── ICON-ESM-ER ────────────────────────────────────────────────────────
  ICON-ESM-ER:
    institution: MPI-M
    ensemble: EERIE
    experiment: hist-1950
    variant: r1i1p1f1
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#2ca02c"

  # r2/r3 are published only as kerchunk reference stores (no CMOR tree).
  # `member` selects the store sub-directory under data_root: 2 → r2i1p1f1,
  # 3 → r3i1p1f1.  Both cover 1975-02 → 2014-12 on the standard 0.25° grid.
  ICON-ESM-ER-r2:
    institution: MPI-M
    ensemble: EERIE
    experiment: hist-1950
    variant: r2i1p1f1
    data_source_type: "icon_kerchunk"
    data_root: "/work/bm1344/DKRZ/kerchunks_batched/ICON/phase2/hist-1950/v20240618"
    member: 2
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#66c266"

  ICON-ESM-ER-r3:
    institution: MPI-M
    ensemble: EERIE
    experiment: hist-1950
    variant: r3i1p1f1
    data_source_type: "icon_kerchunk"
    data_root: "/work/bm1344/DKRZ/kerchunks_batched/ICON/phase2/hist-1950/v20240618"
    member: 3
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#a0dba0"

  # ── HadGEM3-GC5 ───────────────────────────────────────────────────────
  HadGEM3-GC5:
    institution: MOHC
    ensemble: EERIE
    experiment: eerie-historical
    variant: r1i1p1f1
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#d62728"
    data_root: "/work/bm1344/AWI/EERIE/MOHC/HadGEM3-GC5-EERIE-N640-ORCA12"
    grid_label: "gr1"
    variable_aliases:
      thetao: "thetao-con"
      so: "so-abs"
      tos: "toscon"
      sos: "sosabs"
    scale_factors:
      clt: 100
    absolute_salinity: true

