# Two benchmark ensembles read from the pre-built per-variable zarr cache.
# Models are auto-discovered from each cache directory (one member per model).
benchmarks:
  - name: "CMIP6"
    label: "CMIP6 MMM"
    zarr_dir: "/work/bm1344/AWI/EERIE/cmip6_pool_zarr/cmip6_historical"
    experiment: historical
    models: auto
    color: "#7f7f7f"
    regrid_resolution: 0.25
    influence_radius: 80000
    ensemble_mode: one_per_model
  - name: "HighResMIP"
    label: "HighResMIP MMM"
    zarr_dir: "/work/bm1344/AWI/EERIE/cmip6_pool_zarr/highresmip_hist-1950"
    experiment: hist-1950
    models: auto
    color: "#9467bd"
    regrid_resolution: 0.25
    influence_radius: 80000
    ensemble_mode: one_per_model

dask:
  n_workers: 4
  memory_limit: "8GB"

nereus:
  projection: "rob"
  resolution: 0.25
  influence_radius: 80000
  ocean_influence_radius: 20000
  method: "linear"
  # Common grid for `precipitation_mswep`.  EERIE models are 0.25°, so
  # building the common grid at 0.25° compares like with like instead of
  # refining every model onto MSWEP's native 0.1°.  MSWEP is coarsened onto
  # it conservatively (see conservative_fluxes below).
  precip_resolution: 0.25
  # Precipitation and flux fields are remapped area-conservatively so the
  # domain integral is preserved; `method` above still applies to every
  # other variable.  Set false to restore point interpolation everywhere.
  conservative_fluxes: true
  # Guard on BOTH the source point count and the target cell count —
  # conservative weights need a spherical Voronoi tessellation and polygon
  # overlaps, and cost grows with both.  Raised above the 2M default so that
  # the MSWEP obs (0.1° = 6,480,000 points) is coarsened onto the 0.25°
  # common grid conservatively: that aggregation step is the one that most
  # needs conserving, and the 2M default would silently skip it.
  # Measured on this grid: model 0.25° source ≈ 15 min of weight building,
  # MSWEP 0.1° source longer — both one-off and cached per source grid
  # (applying weights is ~0.01 s).
  conservative_max_points: 8000000

output_dir: "/work/bm1344/AWI/EERIE/output_eerie_10_mems_cmip6"

llm:
  figure_analysis:
    provider: "vertex"
    model: "gemini-2.5-flash"
    api_key_env: "VERTEX_API_KEY"
    thinking_budget: 8192
    max_retries: 3
    retry_delay: 10
    skip_existing: true

report:
  model: "gpt-5.2-2025-12-11"
  max_tokens: 65536
  temperature: 0.3
  api_key_env: "OPENAI_API_KEY"
  n_highlights: 10

website:
  title: "Feather — EERIE 10-Member Evaluation (CMIP6 + HighResMIP benchmarks)"
  subtitle: "EERIE 10-member ensemble vs CMIP6 historical + HighResMIP hist-1950 MMM (1980-2014)"
  group_order:
    - evaluation
    - regions
    - ocean_added_value
    - temperature
    - precipitation
    - climate_classification
    - radiation
    - circulation
    - ocean_surface
    - sea_ice
    - ocean_3d
  group_labels:
    evaluation: "Global Biases"
    regions: "CORDEX Regions"
    ocean_added_value: "Ocean Added Value"
    temperature: "Temperature"
    precipitation: "Precipitation"
    climate_classification: "Climate Classification"
    radiation: "Radiation Budget"
    circulation: "Atmospheric Circulation"
    ocean_surface: "Ocean Surface"
    sea_ice: "Sea Ice"
    ocean_3d: "Ocean 3D"
