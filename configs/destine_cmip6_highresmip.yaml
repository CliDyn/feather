# Two benchmark ensembles read from the pre-built per-variable zarr cache.
# Models are auto-discovered from each cache directory (one member per model).
# Each benchmark stitches its historical segment with the 2015-2025 scenario
# extension (built by scripts/convert_pool_scenario.py) so the MMM spans the
# full DestinE 1990-2025 window: CMIP6 historical -> ssp370, HighResMIP
# hist-1950 -> highres-future. Models lacking the scenario for their cached
# member simply end at 2014.
benchmarks:
  - name: "CMIP6"
    label: "CMIP6 MMM"
    zarr_dir: "/work/bm1344/AWI/EERIE/cmip6_pool_zarr/cmip6_historical"
    experiments: [historical, ssp370]
    models: auto
    color: "#7f7f7f"
    regrid_resolution: 0.25
    influence_radius: 80000
    ensemble_mode: one_per_model
  - name: "HighResMIP"
    label: "HighResMIP MMM"
    zarr_dir: "/work/bm1344/AWI/EERIE/cmip6_pool_zarr/highresmip_hist-1950"
    experiments: [hist-1950, highres-future]
    models: auto
    color: "#9467bd"
    regrid_resolution: 0.25
    influence_radius: 80000
    ensemble_mode: one_per_model

