# ─────────────────────────────────────────────────────────────────────────────
# DestinE high-resolution ensemble evaluation with TWO benchmark ensembles:
#   * CMIP6 historical      — all models on disk, one member each (full DKRZ pool)
#   * HighResMIP hist-1950  — all models on disk, one member each
#
# Same DestinE models as configs/destine_added_value.yaml (IFS-FESOM, IFS-NEMO,
# ICON at ~5 km, stitched baseline_hist + ssp3-7.0), but instead of the intake
# CMIP6 multi-model mean it uses the per-variable zarr-cache `benchmarks`
# mechanism to render BOTH the CMIP6 and HighResMIP MMM as separate lines/panels.
#
# Both benchmarks are read from a per-variable zarr cache built once with
# scripts/convert_pool_cmip6.py (historical) and extended to 2025 with
# scripts/convert_pool_scenario.py (scenario).  Models are auto-discovered from
# each cache (`models: auto`) and stitched historical -> scenario in time, so
# the benchmark MMMs span the DestinE 1990-2025 analysis window.
#
# Build the caches first (compute node — heavy I/O):
#   # 1) historical / hist-1950 segment (1980-2014)
#   python scripts/convert_pool_cmip6.py --activity CMIP \
#       --experiment historical --period 1980 2014 \
#       --out /work/bm1344/AWI/EERIE/cmip6_pool_zarr/cmip6_historical -v
#   python scripts/convert_pool_cmip6.py --activity HighResMIP \
#       --experiment hist-1950 --period 1980 2014 \
#       --out /work/bm1344/AWI/EERIE/cmip6_pool_zarr/highresmip_hist-1950 -v
#   # 2) scenario extension (2015-2025), same models+member as the caches
#   python scripts/convert_pool_scenario.py --activity ScenarioMIP \
#       --experiment ssp370 --base-experiment historical \
#       --cache /work/bm1344/AWI/EERIE/cmip6_pool_zarr/cmip6_historical \
#       --period 2015 2025 -v
#   python scripts/convert_pool_scenario.py --activity HighResMIP \
#       --experiment highres-future --base-experiment hist-1950 \
#       --cache /work/bm1344/AWI/EERIE/cmip6_pool_zarr/highresmip_hist-1950 \
#       --period 2015 2025 -v
# ─────────────────────────────────────────────────────────────────────────────

project:
  name: "DestinE"
  description: "DestinE ensemble vs CMIP6 + HighResMIP benchmarks"
  experiment: "baseline_hist"
  # Stitched along time: historical baseline + ssp3-7.0 projection.
  # No single DestinE experiment covers 1990-2025, so segments are
  # concatenated (baseline_hist -> 2014, projections_ssp3-7.0 2015+).
  experiments: ["baseline_hist", "projections_ssp3-7.0"]
  period: ["1990", "2025"]
  # Time-series figures extend to each model's full projection end
  # (IFS-FESOM/IFS-NEMO -> 2049, ICON -> 2044); obs/benchmarks overlaid where
  # available. All other diagnostics use the analysis period above.
  timeseries_period: ["1990", "2050"]
  resolution: "high-resolution (~5 km)"
  comparison_type: "multi_model"
  comparison_description: >-
    The Destination Earth high-resolution ensemble (IFS-FESOM, IFS-NEMO, ICON
    at ~5 km) evaluated against two benchmark ensembles: the full CMIP6
    historical multi-model mean and the HighResMIP hist-1950 multi-model mean,
    each computed from one member per model. Primary reference datasets:
    Berkeley Earth HR (0.25°) for 2m temperature, MSWEP v2.8 for precipitation,
    ERA5 for all other surface variables.

data_source:
  type: "destine_catalog"

model_catalogs:
  2d: "/work/ab0995/a270088/DestinE/GENERATION2_joint/2D/catalog.yaml"
  3d: "/work/ab0995/a270088/DestinE/GENERATION2_joint/3D/catalog.yaml"

models:
  ifs-fesom:
    grids: {sfc: healpix, o2d: healpix, pl: healpix, o3d: healpix}
    member: 1
    color: "#1f77b4"
    absolute_salinity: false
  ifs-nemo:
    grids: {sfc: healpix, o2d: healpix, pl: healpix, o3d: healpix}
    member: 1
    color: "#ff7f0e"
    absolute_salinity: true
  icon:
    grids: {sfc: healpix, o2d: healpix, pl: healpix, o3d: healpix}
    member: 1
    color: "#2ca02c"
    absolute_salinity: false

