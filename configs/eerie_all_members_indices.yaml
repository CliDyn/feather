# ─────────────────────────────────────────────────────────────────────────────
# EERIE 10-member extreme-temperature indices — present-day indices AND
# climate-change signal — with ERA5 as the observational reference (instead of
# Berkeley Earth).
#
# Serves these diagnostics from a single config:
#   tropical_nights / heatwave          → flat `models` + project.period
#   tropical_nights_change / heatwave_change / temp_extremes_change
#                                       → project.climate_change block
#   temp_extremes_indices               → flat `models` (historical) +
#                                         climate_change (future) +
#                                         project.temp_extremes_indices
#
# temp_extremes_indices: 14 ETCCDI indices from daily tasmax/tasmin as defined
# for the C3S CMIP6 extreme-indices dataset (sis-extreme-indices-cmip6), over
# LAND only (land-area fraction > 50 %: own sftlf, else the ERA5 mask — no
# EERIE member publishes sftlf, so all of them use ERA5's):
#   TXx/TNx/TXn/TNn  max/min of daily max/min temperature        °C
#   DTR              mean diurnal temperature range              °C
#   FD / ID          frost days (TN < 0 °C) / ice days (TX < 0)  days
#   TX10p/TX90p      cold / warm days   (vs calendar-day pctl)   % of days
#   TN10p/TN90p      cold / warm nights (vs calendar-day pctl)   % of days
#   WSDI / CSDI      warm / cold spell duration (runs ≥ 6 days)  days
#   GSL              growing season length, TG = (TX+TN)/2       days
# Percentiles: each dataset's own 1981–2000 calendar-day 10th/90th, 5-day
# window, no bootstrap, held fixed for the future (so TX10p…TN90p are ≈ 10 %
# over the base period by construction: change maps + time series only).
#
# Daily tasmax/tasmin availability (checked 2026-10-10):
#   member              hist                                   SSP2-4.5
#   IFS-FESOM2-SR r1    CMOR                                   CMOR, to 2050
#   IFS-FESOM2-SR r2/r3 kerchunk 2D_daily_0.25deg_atmos_min/max r2 to 2030 / none
#   IFS-NEMO-ER r1/2/3  CMOR (AWI copy)                        CMOR, to 2050
#   ICON-ESM-ER r1      CMOR                                   CMOR, to 2050
#   ICON-ESM-ER r2      kerchunk: tasmin remap025; tasmax only on the native
#                       R2B8 grid → regridded on the fly with the CDO
#                       conservative weights that made the remap025 stores
#   ICON-ESM-ER r3      kerchunk remap025                      none
#   HadGEM3-GC5         none (no daily tasmax/tasmin in either MOHC tree) —
#                       skipped by every diagnostic here
#
# ERA5 plays two roles (project.extremes_obs_reference: ERA5):
#   * a full participant in the base TN/heatwave diagnostics — indices computed
#     from the derived ERA5 daily tasmin/tasmax CMOR tree (table=day), masked by
#     ERA5's own sftlf;
#   * the monthly-mean obs reference for the Tmin/Tmax bias maps and the
#     approximate observed-TN series in all four diagnostics.
#
# Prerequisites (run scripts/era5_derive_tasminmax.sh + _finalize + _landmask):
#   daily   ERA5 → /work/bm1344/AWI/OBS/era5_derived/CMOR/ECMWF/ERA5/era5/...
#   monthly ERA5 → /work/bm1344/AWI/OBS/era5_derived/mon/ERA5_tas{min,max}_*_1980-2023.nc
#   sftlf   ERA5 → /work/bm1344/AWI/OBS/era5_derived/CMOR/.../fx/sftlf/gr/v1/...
# ─────────────────────────────────────────────────────────────────────────────

project:
  name: "EERIE"
  description: "EERIE 10-member daily temperature extreme indices vs ERA5"
  experiment: "hist-1950"
  period: ["1981", "2000"]          # base-diagnostic index window (reference)
  resolution: "high-resolution (~10-20 km atm, ~5-10 km ocean)"
  comparison_type: "multi_model"
  # One summary per model family: ICON-ESM-ER runs without a parameterised
  # convection scheme, so its members are not pooled with the IFS runs.
  ensemble_mode: per_family
  comparison_description: >-
    Present-day and SSP2-4.5 climate-change signals in daily temperature
    extreme indices (tropical nights, heatwaves and the ETCCDI set: TXx, TNx,
    TXn, TNn, DTR, frost and ice days, warm/cold days and nights, warm/cold
    spell duration, growing season length) over land for the EERIE models,
    each summarised by the mean of its own members (IFS-FESOM2-SR: 3,
    IFS-NEMO-ER: 3, ICON-ESM-ER: 3; HadGEM3-GC5 publishes no daily
    tasmax/tasmin), compared with the daily CMIP6 multi-model mean and
    evaluated against ERA5-derived daily extremes. The present-day
    climatology covers 1981-2000 and the climate-change signal is SSP2-4.5
    2031-2050 minus 1981-2000.
  extremes_obs_reference: "ERA5"    # use ERA5 instead of Berkeley Earth

  temp_extremes_indices:
    # All fourteen by default; list a subset to run fewer.
    indices: [txx, tnx, txn, tnn, dtr, fd, id, tx10p, tx90p, tn10p, tn90p,
              wsdi, csdi, gsl]
    base_period: ["1981", "2000"]   # calendar-day percentile thresholds
    # Seasonal versions of every index except WSDI, CSDI and GSL (DJF = Dec of
    # the previous year + Jan–Feb).  Remove to run annual only.
    seasons: [DJF, MAM, JJA, SON]
    # Daily observations as CMOR trees ({data_root}/{experiment}/r1i1p1f1/
    # day/{tasmax,tasmin}/gr/v1/), processed exactly like a model (own land
    # mask and percentiles).  Derived by scripts/era5_derive_tasminmax.sh.
    obs:
      ERA5:
        data_root: /work/bm1344/AWI/OBS/era5_derived/CMOR/ECMWF/ERA5
        experiment: era5
        color: "black"
    obs_load_period: ["1981", "2014"]
    # Memory budget (GB) for the base-period block behind the percentiles;
    # above it the land cells are processed in groups (re-reading the base
    # period per group).  A 0.25° member needs ~9 GB per variable.
    percentile_memory_gb: 12

  climate_change:
    reference_period: ["1981", "2000"]
    future_period:    ["2031", "2050"]
    hist_load_period: ["1981", "2014"]
    ssp_load_period:  ["2015", "2050"]
    obs_end_year:     "2024"
    models:
      IFS-FESOM2-SR:
        hist_experiment:    hist-1950
        hist_data_source:   cmor
        future_experiment:  highres-future-ssp245
        future_data_source: cmor
      IFS-FESOM2-SR-r2:
        hist_data_source:   kerchunk_native
        hist_data_root:     /work/bm1344/DKRZ/kerchunks/IFS-FESOM2/hist-1950
        future_data_source: kerchunk_native
        future_data_root:   /work/bm1344/DKRZ/kerchunks/IFS-FESOM2/ssp245
        future_only_to:     "2030"
      IFS-FESOM2-SR-r3:
        hist_data_source:   kerchunk_native
        hist_data_root:     /work/bm1344/DKRZ/kerchunks/IFS-FESOM2/hist-1950
      IFS-NEMO-ER:
        hist_experiment:    hist-1950
        hist_data_source:   cmor
        hist_data_root:     /work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER
        future_experiment:  highres-future-ssp245
        future_data_source: cmor
        future_data_root:   /work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER
      IFS-NEMO-ER-r2:
        hist_experiment:    hist-1975
        hist_data_source:   cmor
        hist_data_root:     /work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER
        future_experiment:  highres-future-ssp245
        future_data_source: cmor
        future_data_root:   /work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER
      IFS-NEMO-ER-r3:
        hist_experiment:    hist-1975
        hist_data_source:   cmor
        hist_data_root:     /work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER
        future_experiment:  highres-future-ssp245
        future_data_source: cmor
        future_data_root:   /work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER
      ICON-ESM-ER:
        hist_experiment:    hist-1950
        hist_data_source:   cmor
        future_experiment:  highres-future-ssp245
        future_data_source: cmor

# Global default source for the flat-model (base) diagnostics.
data_source:
  type: "cmor"
  root: "/work/bm1344/DKRZ/CMOR/EERIE/HighResMIP"

# Flat models: tropical_nights / heatwave, and the historical runs of
# temp_extremes_indices.  ERA5 is added as an observational "model" reading its
# derived daily CMOR tree for tropical_nights / heatwave; temp_extremes_indices
# treats it as observations only (it is listed under temp_extremes_indices.obs).
# Members lacking daily tasmin/tasmax are skipped gracefully.
models:
  ERA5:
    institution: ECMWF
    experiment: era5
    variant: r1i1p1f1
    data_root: "/work/bm1344/AWI/OBS/era5_derived/CMOR/ECMWF/ERA5"
    grids:
      sfc: latlon
    color: "#000000"

  IFS-FESOM2-SR:
    institution: AWI
    ensemble: EERIE
    family: IFS-FESOM2-SR
    experiment: hist-1950
    variant: r1i1p1f1
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#1f77b4"

  IFS-FESOM2-SR-r2:
    institution: AWI
    ensemble: EERIE
    family: IFS-FESOM2-SR
    experiment: hist-1950
    variant: r2i1p1f1
    data_source_type: "kerchunk_parquet"
    data_root: "/work/bm1344/DKRZ/kerchunks/IFS-FESOM2/hist-1950"
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#5aabdf"

  IFS-FESOM2-SR-r3:
    institution: AWI
    ensemble: EERIE
    family: IFS-FESOM2-SR
    experiment: hist-1950
    variant: r3i1p1f1
    data_source_type: "kerchunk_parquet"
    data_root: "/work/bm1344/DKRZ/kerchunks/IFS-FESOM2/hist-1950"
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#9fcfe8"

  # ── IFS-NEMO-ER ────────────────────────────────────────────────────────
  IFS-NEMO-ER:
    institution: BSC
    ensemble: EERIE
    family: IFS-NEMO-ER
    experiment: hist-1950
    variant: r1i1p1f1
    data_root: "/work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER"
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#ff7f0e"
    absolute_salinity: true

  # r2/r3 daily tasmax/tasmin are in the AWI copy of the BSC tree; the DKRZ
  # CMOR tree has no day table for hist-1975 r2.
  IFS-NEMO-ER-r2:
    institution: BSC
    ensemble: EERIE
    family: IFS-NEMO-ER
    experiment: hist-1975
    variant: r2i1p1f1
    data_root: "/work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER"
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#e07b00"
    absolute_salinity: true

  IFS-NEMO-ER-r3:
    institution: BSC
    ensemble: EERIE
    family: IFS-NEMO-ER
    experiment: hist-1975
    variant: r3i1p1f1
    data_root: "/work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER"
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#a85800"
    absolute_salinity: true

  # ── ICON-ESM-ER ────────────────────────────────────────────────────────
  ICON-ESM-ER:
    institution: MPI-M
    ensemble: EERIE
    family: ICON-ESM-ER
    experiment: hist-1950
    variant: r1i1p1f1
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#2ca02c"

  # r2/r3 are not CMOR'd: daily stores from the gr025 kerchunk references.
  # r2's daily maximum exists only on the native grid and is regridded on
  # the fly (see feather/data/icon_kerchunk_loader.py).
  ICON-ESM-ER-r2:
    institution: MPI-M
    ensemble: EERIE
    family: ICON-ESM-ER
    experiment: hist-1950
    variant: r2i1p1f1
    data_source_type: "icon_kerchunk"
    data_root: "/work/bm1344/DKRZ/kerchunks_batched/ICON/phase2/hist-1950/v20240618"
    member: 2
    grids:
      sfc: latlon
    color: "#66c266"

  ICON-ESM-ER-r3:
    institution: MPI-M
    ensemble: EERIE
    family: ICON-ESM-ER
    experiment: hist-1950
    variant: r3i1p1f1
    data_source_type: "icon_kerchunk"
    data_root: "/work/bm1344/DKRZ/kerchunks_batched/ICON/phase2/hist-1950/v20240618"
    member: 3
    grids:
      sfc: latlon
    color: "#a0dba0"

  # ── HadGEM3-GC5 ───────────────────────────────────────────────────────
  # No daily tasmax/tasmin in either MOHC tree: kept for completeness of the
  # 10-member set, skipped (with a warning) by every diagnostic in this config.
  HadGEM3-GC5:
    institution: MOHC
    ensemble: EERIE
    family: HadGEM3-GC5
    experiment: eerie-historical
    variant: r1i1p1f1
    data_root: "/work/bm1344/AWI/EERIE/MOHC/HadGEM3-GC5-EERIE-N640-ORCA12"
    grid_label: "gr1"
    grids:
      sfc: latlon
      o2d: latlon
      o3d: latlon
    color: "#d62728"

obs_root: "/work/bm1344/AWI/OBS"
obs_datasets:
  # Derived ERA5 monthly tasmin/tasmax (monthly mean of daily extremes), K.
  ERA5_TMINMAX:
    path: "/work/bm1344/AWI/OBS/era5_derived/mon"
    variables:
      tasmin: "ERA5_tasmin_daymin_mon_1980-2023.nc"
      tasmax: "ERA5_tasmax_daymax_mon_1980-2023.nc"
  # ERA5 land-sea mask (sftlf, %) — used to land-mask the approximate obs series.
  ERA5_SFTLF:
    path: "/work/bm1344/AWI/OBS/era5_derived/CMOR/ECMWF/ERA5/era5/r1i1p1f1/fx/sftlf/gr/v1"
    variables:
      sftlf: "sftlf_fx_ERA5_era5_r1i1p1f1_gr.nc"

# Daily CMIP6 ensemble for temp_extremes_indices, read straight from the DRS
# NetCDF tree: one member per model, the first with day/tasmax AND day/tasmin
# in both historical and ssp245.
cmip6_daily:
  enabled: true
  label: "CMIP6"
  root: "/work/ik1017/CMIP6/data/CMIP6"
  experiment: historical
  future_experiment: ssp245
  member: r1i1p1f1
  models: auto            # or an explicit list of source_ids
  exclude: []
  # max_models: 5         # uncomment for a quick staged run

# The monthly benchmark machinery is not used by these diagnostics.
cmip6:
  enabled: false

dask:
  n_workers: 8
  memory_limit: "16GB"

nereus:
  projection: "rob"
  resolution: 0.25
  influence_radius: 80000
  method: "linear"

output_dir: "/work/bm1344/AWI/EERIE/output_eerie_all_members_indices_only"

llm:
  figure_analysis:
    provider: "vertex"
    model: "gemini-2.5-flash"
    api_key_env: "VERTEX_API_KEY"
    thinking_budget: 8192
    max_retries: 3
    retry_delay: 10
    skip_existing: true

website:
  title: "Feather — EERIE 10-Member Temperature Extremes"
  subtitle: "ETCCDI, tropical-night & heatwave indices vs ERA5 and daily CMIP6 (1981–2000; SSP2-4.5 2031–2050)"
  group_order:
    - temperature_extremes
    - extremes
    - regions
  group_labels:
    temperature_extremes: "Temperature Extremes (ETCCDI)"
    extremes: "Extreme Events"
    regions: "CORDEX Regions"
