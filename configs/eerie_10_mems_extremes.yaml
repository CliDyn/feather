# ─────────────────────────────────────────────────────────────────────────────
# EERIE 10-member heatwave-hotspots (extreme-heat tail-widening) diagnostic.
#
# Same diagnostic as configs/eerie_all_members_extremes.yaml, but with the
# member list taken from configs/eerie_10_mems_cmip6.yaml (3 IFS-FESOM2-SR,
# 3 IFS-NEMO-ER, 3 ICON-ESM-ER, 1 HadGEM3-GC5) instead of the 7 members that
# config carried.  ERA5 is both an evaluated "model" (its derived daily CMOR
# tree) and the obs reference.
#
# Reproduces Figures 2–4 of Sambartusek, Kornhuber et al. (2024, PNAS,
# doi:10.1073/pnas.2411258121) — "A global emergence of regional heatwave
# hotspots".
#
# Core metric ("tail-widening"): at each grid point and each year, compute the
# 99th and 87.5th percentiles of *daily* maximum 2 m temperature (tasmax, day
# table); the yearly tail width D = P99 − P87.5; then the linear trend of D over
# the analysis period (°C/decade).  Everything is regridded to a common 0.25°
# grid, land-masked (>25 %), and masked grey where the P87.5 trend is negative.
#
# ── Which of the 10 members actually run ─────────────────────────────────────
# The diagnostic needs *daily* tasmax.  8 of the 10 publish it:
#
#   IFS-FESOM2-SR   r1   CMOR             day/tasmax
#   IFS-FESOM2-SR   r2   kerchunk_parquet daily store
#   IFS-FESOM2-SR   r3   kerchunk_parquet daily store
#   IFS-NEMO-ER     r1   CMOR             hist-1950/day/tasmax
#   IFS-NEMO-ER     r2   CMOR             hist-1975/day/tasmax
#   IFS-NEMO-ER     r3   CMOR             hist-1975/day/tasmax
#   ICON-ESM-ER     r1   CMOR             day/tasmax
#   ICON-ESM-ER     r3   icon_kerchunk    erc2023_atmos_native_2d_daily_max_remap025.parq
#
# The remaining two are defined below but commented out — the data does not
# exist, so enabling them only produces a "skipping" warning:
#
#   ICON-ESM-ER r2  — publishes 2d_daily_max on the *native* unstructured grid
#                     only; there is no _remap025 variant (r3 has one), and
#                     ICONKerchunkLoader does no regridding.  Its daily
#                     *tasmin* IS remapped, so this entry can be enabled for
#                     tropical_nights / tasmin-based runs.
#   HadGEM3-GC5     — no daily tasmax anywhere: the EERIE-N640-ORCA12 run
#                     (…/AWI/EERIE/MOHC/…) has no day/ table at all, and
#                     GC5E-HH (/work/bm1344/DKRZ/MOHC/HadGEM3-GC5E-HH/) has
#                     day/{pr,psl,tas,ua,uas,vas,zg} but tasmax only in Amon.
#
# Note on ICON r2/r3 monthly data: their gr025 monthly stores declare tasmin /
# tasmax but never reset the accumulators (999.0 and −99.0 in every cell), so
# the loader refuses to serve them monthly.  Only table="day" gives real
# extremes for these members.
#
# A daily CMIP6 envelope is included by reading tasmax straight from the DKRZ
# CMIP6 DRS tree (/work/ik1017/CMIP6/data/CMIP6/.../historical/r1i1p1f1/day/
# tasmax/) — no zarr cache needed; see the cmip6_daily block below.  Per-model
# yearly percentiles are cached to NetCDF so the heavy daily recompute runs
# once per model.
#
# Prerequisites (ERA5 derived daily/monthly, run scripts/era5_derive_*.sh):
#   daily   ERA5 → /work/bm1344/AWI/OBS/era5_derived/CMOR/ECMWF/ERA5/era5/...
#   sftlf   ERA5 → /work/bm1344/AWI/OBS/era5_derived/CMOR/.../fx/sftlf/gr/v1/...
#
# Run (compute node — daily data + per-year percentiles are heavy):
#   feather --config configs/eerie_10_mems_extremes.yaml \
#           --diagnostics heatwave_hotspots --variables tasmax \
#           --steps diagnostics -v
# ─────────────────────────────────────────────────────────────────────────────

project:
  name: "EERIE"
  description: "EERIE 10-member heatwave hotspots (extreme-heat tail-widening) vs ERA5"
  experiment: "hist-1950"
  period: ["1980", "2014"]          # common window: ERA5 + EERIE hist + CMIP6 historical
  resolution: "high-resolution (~10-20 km atm, ~5-10 km ocean)"
  comparison_type: "multi_model"
  comparison_description: >-
    Trends in extreme-heat tail-widening (yearly 99th minus 87.5th percentile of
    daily tasmax) across the EERIE 10-member high-resolution ensemble, evaluated
    against ERA5-derived daily extremes, reproducing Sambartusek/Kornhuber et al.
    (2024, PNAS) Figs. 2–4.
  extremes_obs_reference: "ERA5"    # ERA5 is the reanalysis reference

# Global default source for the flat-model diagnostics.  Overridden per-model
# by IFS-FESOM2-SR r2/r3 (kerchunk_parquet) and ICON-ESM-ER r3 (icon_kerchunk),
# which routes everything through CompositeModelLoader.
data_source:
  type: "cmor"
  root: "/work/bm1344/DKRZ/CMOR/EERIE/HighResMIP"

models:
  ERA5:
    institution: ECMWF
    experiment: era5
    variant: r1i1p1f1
    data_root: "/work/bm1344/AWI/OBS/era5_derived/CMOR/ECMWF/ERA5"
    grids:
      sfc: latlon
    color: "#000000"

  # ── IFS-FESOM2-SR ──────────────────────────────────────────────────────
  IFS-FESOM2-SR:
    institution: AWI
    experiment: hist-1950
    variant: r1i1p1f1
    grids:
      sfc: latlon
    color: "#1f77b4"

  # r2/r3 — historical only (daily tasmax via kerchunk parquet).
  IFS-FESOM2-SR-r2:
    institution: AWI
    experiment: hist-1950
    variant: r2i1p1f1
    data_source_type: "kerchunk_parquet"
    data_root: "/work/bm1344/DKRZ/kerchunks/IFS-FESOM2/hist-1950"
    grids:
      sfc: latlon
    color: "#5aabdf"

  IFS-FESOM2-SR-r3:
    institution: AWI
    experiment: hist-1950
    variant: r3i1p1f1
    data_source_type: "kerchunk_parquet"
    data_root: "/work/bm1344/DKRZ/kerchunks/IFS-FESOM2/hist-1950"
    grids:
      sfc: latlon
    color: "#9fcfe8"

  # ── IFS-NEMO-ER ────────────────────────────────────────────────────────
  IFS-NEMO-ER:
    institution: BSC
    experiment: hist-1950
    variant: r1i1p1f1
    data_root: "/work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER"
    grids:
      sfc: latlon
    color: "#ff7f0e"

  # r2/r3 — hist-1975 (CMOR); the data root also holds the SSP2-4.5 future, so
  # a future window can be added later without moving data.
  IFS-NEMO-ER-r2:
    institution: BSC
    experiment: hist-1975
    variant: r2i1p1f1
    data_root: "/work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER"
    grids:
      sfc: latlon
    color: "#e07b00"

  IFS-NEMO-ER-r3:
    institution: BSC
    experiment: hist-1975
    variant: r3i1p1f1
    data_root: "/work/bm1344/AWI/EERIE/BSC/IFS-NEMO-ER"
    grids:
      sfc: latlon
    color: "#a85800"

  # ── ICON-ESM-ER ────────────────────────────────────────────────────────
  ICON-ESM-ER:
    institution: MPI-M
    experiment: hist-1950
    variant: r1i1p1f1
    grids:
      sfc: latlon
    color: "#2ca02c"

  # r3 is published only as kerchunk reference stores (no CMOR tree).
  # `member` selects the store sub-directory under data_root: 3 → r3i1p1f1.
  # Daily tasmax comes from erc2023_atmos_native_2d_daily_max_remap025.parq,
  # already on the standard 0.25° grid, 1975-01-02 → 2014-12-31.
  ICON-ESM-ER-r3:
    institution: MPI-M
    experiment: hist-1950
    variant: r3i1p1f1
    data_source_type: "icon_kerchunk"
    data_root: "/work/bm1344/DKRZ/kerchunks_batched/ICON/phase2/hist-1950/v20240618"
    member: 3
    grids:
      sfc: latlon
    color: "#a0dba0"

  # ICON-ESM-ER r2 — no remapped daily-max store (see header).  Enable this
  # block for tasmin-based diagnostics (tropical_nights), where the
  # 2d_daily_min_remap025 store does exist.
  # ICON-ESM-ER-r2:
  #   institution: MPI-M
  #   experiment: hist-1950
  #   variant: r2i1p1f1
  #   data_source_type: "icon_kerchunk"
  #   data_root: "/work/bm1344/DKRZ/kerchunks_batched/ICON/phase2/hist-1950/v20240618"
  #   member: 2
  #   grids:
  #     sfc: latlon
  #   color: "#66c266"

  # ── HadGEM3-GC5 ────────────────────────────────────────────────────────
  # No daily tasmax is published for either HadGEM3 run (see header), so the
  # 10th member cannot take part in this diagnostic.
  # HadGEM3-GC5:
  #   institution: MOHC
  #   experiment: eerie-historical
  #   variant: r1i1p1f1
  #   data_root: "/work/bm1344/AWI/EERIE/MOHC/HadGEM3-GC5-EERIE-N640-ORCA12"
  #   grid_label: "gr1"
  #   grids:
  #     sfc: latlon
  #   color: "#d62728"

obs_root: "/work/bm1344/AWI/OBS"
obs_datasets:
  # Derived ERA5 monthly tasmin/tasmax (monthly mean of daily extremes), K.
  ERA5_TMINMAX:
    path: "/work/bm1344/AWI/OBS/era5_derived/mon"
    variables:
      tasmin: "ERA5_tasmin_daymin_mon_1980-2023.nc"
      tasmax: "ERA5_tasmax_daymax_mon_1980-2023.nc"
  # ERA5 land-sea mask (sftlf, %) — used to land-mask the common-grid fields.
  ERA5_SFTLF:
    path: "/work/bm1344/AWI/OBS/era5_derived/CMOR/ECMWF/ERA5/era5/r1i1p1f1/fx/sftlf/gr/v1"
    variables:
      sftlf: "sftlf_fx_ERA5_era5_r1i1p1f1_gr.nc"

# Monthly-zarr CMIP6 benchmark stays off (this diagnostic needs *daily* data).
cmip6:
  enabled: false

# Daily CMIP6 envelope — read straight from the DKRZ CMIP6 DRS NetCDF tree
# (/work/ik1017/CMIP6/data/CMIP6/CMIP/.../historical/r1i1p1f1/day/tasmax/),
# no zarr cache required.  The diagnostic auto-discovers every model that
# publishes daily tasmax (one member each), computes yearly P99/P87.5, and
# caches each model's percentiles to NetCDF (cmip6_{model}_percs_*.nc) so
# re-runs skip the heavy daily recompute.  Shown as a grey min–max envelope
# + dashed MMM on the regional time series / box-whisker, plus three extra
# maps (CMIP6 MMM trend, ERA5−CMIP6 discrepancy, EERIE-mean−CMIP6 MMM).
cmip6_daily:
  enabled: true
  root: "/work/ik1017/CMIP6/data/CMIP6"
  experiment: "historical"
  table: "day"
  member: "r1i1p1f1"
  models: auto            # auto-discover all models with day/tasmax
  label: "CMIP6"
  # exclude: []           # optional list of source_id names to skip
  # max_models: 40        # optional cap for staged runs

dask:
  n_workers: 8
  memory_limit: "16GB"

nereus:
  projection: "rob"
  resolution: 0.25
  influence_radius: 80000
  method: "linear"

output_dir: "/work/bm1344/AWI/EERIE/output_eerie_10_mems_extremes"

llm:
  figure_analysis:
    provider: "vertex"
    model: "gemini-2.5-flash"
    api_key_env: "VERTEX_API_KEY"
    thinking_budget: 8192
    max_retries: 3
    retry_delay: 10
    skip_existing: true

website:
  title: "Feather — EERIE 10-Member Heatwave Hotspots"
  subtitle: "Extreme-heat tail-widening (99th − 87.5th pctile tasmax) vs ERA5 (1980–2014)"
  group_order:
    - extremes
  group_labels:
    extremes: "Extreme Events"
