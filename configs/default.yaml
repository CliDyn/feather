dask:
  n_workers: 4
  memory_limit: "8GB"

nereus:
  projection: "rob"
  resolution: 0.25
  influence_radius: 80000
  ocean_influence_radius: 20000
  method: "linear"

output_dir: "./output"

llm:
  figure_analysis:
    provider: "vertex"
    model: "gemini-3-pro-preview"
    api_key_env: "VERTEX_API_KEY"
    thinking_budget: 8192
    max_retries: 3
    retry_delay: 10
    skip_existing: true

report:
  model: "gpt-5.2-2025-12-11"
  max_tokens: 65536
  temperature: 0.3
  api_key_env: "OPENAI_API_KEY"
  n_highlights: 10

website:
  title: "Feather — Climate Model Evaluation"
  subtitle: "DestinE High-Resolution Simulations vs Observations (1990-2014)"
  group_order:
    - evaluation
    - temperature
    - precipitation
    - radiation
    - circulation
    - ocean_surface
    - sea_ice
    - ocean_3d
    - atmosphere_3d
  group_labels:
    evaluation: "Global Biases"
    temperature: "Temperature"
    precipitation: "Precipitation"
    radiation: "Radiation Budget"
    circulation: "Atmospheric Circulation"
    clouds: "Clouds"
    wind: "Wind"
    moisture: "Moisture"
    surface_fluxes: "Surface Fluxes"
    ocean_surface: "Ocean Surface"
    sea_ice: "Sea Ice"
    ocean_3d: "Ocean 3D"
    atmosphere_3d: "Atmosphere 3D"
